[package]
name = "orbit_qemu_smoke"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
test = false
bench = false

[[bin]]
name = "orbit"
test = false
bench = false

[[bin]]
name = "angler"
test = false
bench = false

[[bin]]
name = "spider"
test = false
bench = false

[[bin]]
name = "skate"
test = false
bench = false

[[bin]]
name = "bees"
test = false
bench = false

[[bin]]
name = "arcade"
test = false
bench = false

# Mirrors firmware/Cargo.toml minus the display/touch drivers. Logging goes
# over UART because QEMU doesn't wire USB-Serial-JTAG to stdout.
[dependencies]
orbit_game = { path = "../../crates/orbit_game" }
orbit_gfx = { path = "../../crates/orbit_gfx" }
orbit_core = { path = "../../crates/orbit_core" }
orbit_save = { path = "../../crates/orbit_save" }
angler_game = { path = "../../crates/angler_game" }
arcade = { path = "../../crates/arcade" }
spider_game = { path = "../../crates/spider_game" }
skate_game = { path = "../../crates/skate_game" }
bees_game = { path = "../../crates/bees_game" }
pals = { path = "../../crates/pals" }
orbit_ui = { path = "../../crates/orbit_ui" }
bevy = { version = "0.19", default-features = false, features = ["default_no_std"] }
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "log-04", "uart", "critical-section"] }
critical-section = "1.2"
log = "0.4"
embedded-storage = "0.3"
esp-storage = { version = "0.10.0", features = ["esp32s3", "embedded-storage"] }

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

# QEMU never sets the BBPLL calibration-done bit, so run.sh copies esp-hal out
# of the cargo registry and deletes that one wait loop. Emulator only.
[patch.crates-io]
esp-hal = { path = ".patched/esp-hal" }
