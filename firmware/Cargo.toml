[package]
name = "orbit_firmware"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
test = false
bench = false

[[bin]]
name = "orbit"
test = false
bench = false

[[bin]]
name = "angler"
test = false
bench = false

# Built with the Xtensa `esp` toolchain, so this crate sits outside the host
# workspace; the game crates come in as plain path dependencies.
[dependencies]
orbit_game = { path = "../crates/orbit_game" }
orbit_gfx = { path = "../crates/orbit_gfx" }
orbit_core = { path = "../crates/orbit_core" }
orbit_save = { path = "../crates/orbit_save" }
angler_game = { path = "../crates/angler_game" }
bevy = { version = "0.19", default-features = false, features = ["default_no_std"] }
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
critical-section = "1.2"
log = "0.4"
embedded-hal = "1"
cst92xx = { version = "0.2.4", default-features = false, features = ["blocking"] }
embedded-hal-bus = "0.3"
embedded-storage = "0.3"
esp-storage = { version = "0.10.0", features = ["esp32s3", "embedded-storage"] }

[lints.clippy]
type_complexity = "allow"

[profile.dev]
# Unoptimized Bevy is far too slow (and big) for a microcontroller.
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
